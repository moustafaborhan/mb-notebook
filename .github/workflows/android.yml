name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create a signing key for this build
        run: |
          PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$PASS"
          echo "MBN_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "MBN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias mbnotebook -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=MB Notebook, C=EG"

      - name: Build the APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MB-Notebook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MB-Notebook-apk
          path: MB-Notebook.apk

      - name: Publish it as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" MB-Notebook.apk \
            --title "MB Notebook for Android (build ${{ github.run_number }})" \
            --notes "Download MB-Notebook.apk on your Android phone and open it to install." \
            --latest
